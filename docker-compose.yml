services:
  prism:
    build: .
    ports:
      - "3800:3800"
    # Lets the container reach a llama.cpp server running on the host via
    # http://host.docker.internal:8080/v1 (see "Local llama.cpp" in the README).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Host folder holding the knowledge base. Defaults to the sample bundle in
      # the checkout; set BUNDLE_HOST_PATH in .env to keep real data outside the
      # repo so runtime writes never dirty the git tree.
      - ${BUNDLE_HOST_PATH:-./sample-bundle}:/bundle
    environment:
      BUNDLE_ROOT: /bundle
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      # Periodic LLM graph maintenance (repair orphans/broken links, merge
      # duplicates). Signal-gated: a healthy graph costs no tokens. Set
      # DREAM_INTERVAL= (empty) in .env to turn it off.
      DREAM_INTERVAL: ${DREAM_INTERVAL-6h}
      DREAM_INSIGHTS: ${DREAM_INSIGHTS:-true}
      # How long a slow memory_* call waits before returning a job id.
      PRISM_MCP_SYNC_WAIT_MS: ${PRISM_MCP_SYNC_WAIT_MS:-}
      # Primary model — all optional (PRISM-14): the instance comes up
      # healthy and fully usable for search/read/write with none of these set.
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      # Fallback model
      LLM_FALLBACK_API_BASE_URL: ${LLM_FALLBACK_API_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_API_FORMAT: ${LLM_FALLBACK_API_FORMAT:-openai}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_ALLOW_FOR: ${LLM_FALLBACK_ALLOW_FOR:-query}
      # Embeddings (PRISM-37, optional) — turns on hybrid semantic+keyword
      # search. Add these later without rebuilding the image; keyword search
      # works fully without them.
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # Legacy compat (still supported)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-}
      LLAMACPP_API_KEY: ${LLAMACPP_API_KEY:-}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      GIT_AUTOCOMMIT: ${GIT_AUTOCOMMIT:-false}
    restart: unless-stopped
