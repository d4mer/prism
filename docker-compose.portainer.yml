# Portainer stack — pulls the prebuilt image from GHCR (no build step).
# Point Portainer at this file (Stacks → Add stack → Repository) and set
# the LLM env vars in the stack's environment variables UI.
#
# PRISM-49: this now points at Prism's own image (.github/workflows/docker.yml
# publishes it to ghcr.io/d4mer/prism on every push to main and on version
# tags). It previously pointed at ghcr.io/thecodacus/understory:latest — the
# upstream project's image, which has diverged from this fork (no tool
# registry, no LLM-optional startup, no hybrid search, etc). That image is
# only published once this repo's own commits are pushed to GitHub and the
# workflow runs — see the README's Docker quick-start for the current status.
services:
  prism:
    image: ghcr.io/d4mer/prism:latest
    ports:
      - "3800:3800"
    # Lets the container reach a llama.cpp server running on the host via
    # http://host.docker.internal:8080/v1 (see "Local llama.cpp" in the README).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent OKF bundle. Swap for a bind mount (e.g. /srv/okf-bundle:/bundle)
      # if you want to edit the markdown from the host / sync it with git.
      - okf-bundle:/bundle
    environment:
      BUNDLE_ROOT: /bundle
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      # Primary model — all optional (PRISM-14): the instance comes up
      # healthy and fully usable for search/read/write with none of these set.
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      # Fallback model
      LLM_FALLBACK_API_BASE_URL: ${LLM_FALLBACK_API_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_API_FORMAT: ${LLM_FALLBACK_API_FORMAT:-openai}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_ALLOW_FOR: ${LLM_FALLBACK_ALLOW_FOR:-query}
      # Embeddings (PRISM-37, optional) — turns on hybrid semantic+keyword
      # search. Add these later without rebuilding/redeploying the image;
      # keyword search works fully without them.
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # Legacy compat (still supported)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-}
      LLAMACPP_API_KEY: ${LLAMACPP_API_KEY:-}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      GIT_AUTOCOMMIT: ${GIT_AUTOCOMMIT:-false}
    restart: unless-stopped

volumes:
  okf-bundle:
